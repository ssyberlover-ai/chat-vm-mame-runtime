<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#070b12">
  <title>Open ROM · Arcade Web Emulator</title>
  <link rel="stylesheet" href="./styles.css?v=arcade-stick-1">
  <!-- EmulatorJS loader: https://cdn.emulatorjs.org/4.2.3/data/loader.js -->
  <!-- ROM catalog: ./roms/manifest.json -->
</head>
<body>
<main>
  <header>
    <div>
      <h1>Open ROM · Arcade Web Emulator</h1>
      <p>오픈 라이선스 및 사용자 제공 ROM · 브라우저 직접 실행</p>
    </div>
    <div id="status" role="status">카탈로그 불러오는 중…</div>
  </header>

  <section id="preflight">
    <p class="intro">
      저장소 포함 ROM과 사용자가 직접 제공한 ROM이 구분되어 표시됩니다.
      아케이드 게임은 원형 8방향 레버와 볼록한 3버튼 조작계를 사용합니다.
    </p>
    <div id="catalog" role="radiogroup" aria-label="실행할 게임 선택"></div>
    <label class="agree">
      <input id="agree" type="checkbox">
      <span id="agree-text">선택한 게임의 라이선스와 이용 조건을 확인했습니다.</span>
    </label>
    <div class="actions">
      <button id="launch" type="button" disabled>선택한 게임 시작</button>
      <span id="selection"></span>
    </div>
  </section>

  <section id="game-shell" hidden aria-label="게임 에뮬레이터">
    <div id="game"></div>
    <section id="touch-controls" aria-label="모바일 게임 컨트롤러">
      <div class="touch-layout">
        <div id="direction-control" class="control-surface" aria-label="방향 조작"></div>
        <div id="system-pad" class="system-pad" aria-label="시스템 버튼"></div>
        <div id="action-pad" class="action-pad" aria-label="액션 버튼"></div>
      </div>
    </section>
  </section>

  <aside class="notice">
    모바일 가로 화면에서는 원형 아케이드 스틱과 볼록한 3버튼이 게임 위에 표시됩니다.
    세로 화면에서는 게임 아래로 분리되며 레버와 버튼을 동시에 길게 누를 수 있습니다.
  </aside>
  <pre id="error" aria-live="polite"></pre>
</main>
<script src="./app.js?v=arcade-stick-1"></script>
</body>
</html>
