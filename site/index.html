<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1018">
<title>Chat VM · Robby Roto</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main>
  <header>
    <div>
      <h1>Chat VM · DOS MAME</h1>
      <p>공식 무료 배포 ROM · Robby Roto</p>
    </div>
    <div id="status" role="status">시작 대기</div>
  </header>

  <progress id="progress" max="100" value="0" hidden></progress>

  <section class="vm-shell" aria-label="에뮬레이터 화면">
    <div id="screen_container" tabindex="0">
      <div></div>
      <canvas></canvas>
      <div id="cover">
        <strong>브라우저에서 바로 실행</strong>
        <span>약관 확인 후 VM 시작을 누르세요.</span>
      </div>
    </div>
  </section>

  <section class="start-panel">
    <label class="agree">
      <input id="agree" type="checkbox">
      <span>Robby Roto ROM의 비상업적 사용 조건과 저작권 고지를 확인했습니다.</span>
    </label>
    <button id="start" class="primary" disabled>VM 시작</button>
    <button id="run" class="primary" disabled>Robby Roto 실행</button>
  </section>

  <section class="toolbar">
    <button id="info" disabled>MAME 정보</button>
    <button id="reboot" disabled>재부팅</button>
    <button id="pause" disabled>일시정지</button>
    <button id="full" disabled>전체화면</button>
  </section>

  <section class="pad" aria-label="게임 조작">
    <button data-key="up">▲</button>
    <button data-key="left">◀</button>
    <button data-key="enter">ENTER</button>
    <button data-key="right">▶</button>
    <button data-key="down">▼</button>
    <button id="ok-pass" type="button">OK 통과</button>
    <button data-key="o">O</button>
    <button data-key="k">K</button>
    <button data-key="5">5 COIN</button>
    <button data-key="1">1 START</button>
    <button data-key="ctrl">CTRL</button>
    <button data-key="alt">ALT</button>
    <button data-key="space">SPACE</button>
    <button data-key="esc">ESC</button>
  </section>

  <details>
    <summary>DOS 명령 입력</summary>
    <div class="command-row">
      <input id="command" placeholder="예: dir, c:, mame -help" disabled>
      <button id="send" disabled>전송</button>
    </div>
  </details>

  <aside class="notice">
    상용 ROM은 포함하지 않습니다. Robby Roto는 권리자의 허가에 따라 MAMEdev가 비상업적 사용용으로 공개한 ROM을 공식 MAMEdev GitHub 저장소에서 직접 불러옵니다. MAME 경고 화면에서는 <b>OK 통과</b> 또는 <b>O → K</b>, 게임 시작은 <b>5 COIN → 1 START</b>를 누르세요.
  </aside>

  <pre id="error" aria-live="polite"></pre>
</main>
<script src="./runtime/libv86.js"></script>
<script>
"use strict";
if (typeof window.V86 !== "function") {
  throw new Error("공식 v86 런타임이 V86 생성자를 등록하지 않았습니다.");
}
</script>
<script src="./emulator-v2.js"></script>
<script>
"use strict";
(() => {
  const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
  const keyScans = {
    up: { down: [0xe0, 0x48], up: [0xe0, 0xc8] },
    down: { down: [0xe0, 0x50], up: [0xe0, 0xd0] },
    left: { down: [0xe0, 0x4b], up: [0xe0, 0xcb] },
    right: { down: [0xe0, 0x4d], up: [0xe0, 0xcd] },
    enter: { down: [0x1c], up: [0x9c] },
    esc: { down: [0x01], up: [0x81] },
    ctrl: { down: [0x1d], up: [0x9d] },
    alt: { down: [0x38], up: [0xb8] },
    space: { down: [0x39], up: [0xb9] },
    "1": { down: [0x02], up: [0x82] },
    "5": { down: [0x06], up: [0x86] },
    o: { down: [0x18], up: [0x98] },
    k: { down: [0x25], up: [0xa5] }
  };

  let inputQueue = Promise.resolve();

  async function performTap(name, holdMilliseconds = 110, settleMilliseconds = 80) {
    const scan = keyScans[name];
    const vm = window.mameVm;
    if (!scan || !vm) return;

    vm.keyboard_send_scancodes(scan.down);
    await sleep(holdMilliseconds);
    vm.keyboard_send_scancodes(scan.up);
    await sleep(settleMilliseconds);
    document.querySelector("#screen_container")?.focus();
  }

  function enqueue(task) {
    inputQueue = inputQueue.then(task, task);
    return inputQueue;
  }

  function tapKey(name) {
    return enqueue(() => performTap(name));
  }

  function sendOk() {
    return enqueue(async () => {
      await performTap("o", 140, 240);
      await performTap("k", 140, 120);
      const status = document.querySelector("#status");
      if (status) status.textContent = "O → K 입력 전송 완료";
    });
  }

  document.addEventListener("pointerdown", event => {
    const okButton = event.target.closest?.("#ok-pass");
    if (okButton) {
      event.preventDefault();
      event.stopImmediatePropagation();
      void sendOk();
      return;
    }

    const keyButton = event.target.closest?.("[data-key]");
    if (!keyButton) return;

    event.preventDefault();
    event.stopImmediatePropagation();
    void tapKey(keyButton.dataset.key);
  }, true);

  document.querySelector("#ok-pass")?.addEventListener("click", event => {
    if (event.detail !== 0) return;
    event.preventDefault();
    void sendOk();
  });

  window.chatVmInputFix = {
    version: "1.0.0",
    tapKey,
    sendOk
  };
})();
</script>
<script>
"use strict";
(() => {
  const runButton = document.querySelector("#run");
  runButton?.addEventListener("click", event => {
    event.preventDefault();
    event.stopImmediatePropagation();
    const vm = window.mameVm;
    if (!vm) return;
    vm.keyboard_send_text(
      "C:\n" +
      "MAME.EXE ROBBY -ROMPATH D:\\ -SOUNDCARD 0 " +
      "-VESA -VESAMODE VESA2L -RESOLUTION 640X480 -DEPTH 16 " +
      "-NOSCANLINES -STRETCH -STEADYKEY\n"
    );
    const status = document.querySelector("#status");
    if (status) status.textContent = "Robby Roto 실행 중 · VESA2L 16-bit";
    document.querySelector("#screen_container")?.focus();
  }, true);
})();
</script>
</body>
</html>
