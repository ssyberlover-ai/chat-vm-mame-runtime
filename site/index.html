<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<title>Open ROM · Web Emulator</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#070b12;color:#f4f7ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#070b12}
body{padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));overscroll-behavior:none}
main{width:min(100%,1040px);margin:auto}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:12px}
h1{margin:0;font-size:22px;line-height:1.15}header p{margin:5px 0 0;color:#9eabc1;font-size:13px}
#status{max-width:45%;font:12px/1.35 ui-monospace,SFMono-Regular,Consolas,monospace;color:#78efaa;text-align:right}
#preflight{padding:16px;border:1px solid #33445e;border-radius:14px;background:#101827}
.intro{margin:0 0 14px;font-size:13px;line-height:1.55;color:#c8d1e2}
#catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.game-card{display:block;position:relative;padding:13px;border:1px solid #405474;border-radius:12px;background:#0b1422;cursor:pointer;min-height:132px}
.game-card:has(input:checked){border-color:#70aaff;background:#142743;box-shadow:0 0 0 2px rgba(84,145,235,.22)}
.game-card input{position:absolute;top:12px;right:12px;width:19px;height:19px}
.game-title{display:block;padding-right:30px;font-size:16px;font-weight:850}
.game-meta{display:block;margin-top:5px;color:#a9b7cb;font-size:12px;line-height:1.45}
.game-license{display:inline-block;margin-top:9px;padding:3px 7px;border-radius:999px;background:#21334d;color:#bcd8ff;font-size:11px;font-weight:750}
.game-license.user{background:#4a2a2a;color:#ffd1d1}
.game-source{display:block;margin-top:8px;color:#92bfff;font-size:11px;text-decoration:none;width:max-content;max-width:100%}
.game-source:hover{text-decoration:underline}
.agree{display:flex;align-items:flex-start;gap:9px;margin:15px 0 11px;font-size:13px;line-height:1.45;color:#e5ebf7}.agree input{width:20px;height:20px;margin:0;flex:none}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
button{min-height:50px;padding:11px 18px;border:1px solid #4c8ee8;border-radius:11px;background:#245da8;color:#fff;font-size:16px;font-weight:800;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.45}
#selection{color:#a9b7cb;font-size:12px}
#game-shell{position:relative;margin-top:12px;padding:7px;border:1px solid #34445e;border-radius:14px;background:#000;overflow:hidden}
#game{width:100%;height:min(82dvh,800px);min-height:520px;background:#000;overflow:hidden;touch-action:none}
#game canvas{image-rendering:pixelated}
.notice{margin-top:12px;padding:11px;border:1px solid #354760;border-radius:10px;background:#0e1726;font-size:12px;line-height:1.5;color:#bec9dc}
#error{white-space:pre-wrap;color:#ff9b9b;font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace}
body.running #preflight{display:none}

#touch-controls{display:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body.touch-ui #touch-controls{display:block}
.touch-layout{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;gap:12px}
.dpad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);aspect-ratio:1;width:min(42vw,205px);gap:4px}
.pad-key{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;padding:0;border:1px solid rgba(197,216,247,.42);background:rgba(18,31,51,.78);color:#fff;box-shadow:none;touch-action:none}
.pad-key.is-pressed{background:rgba(73,137,224,.92);transform:scale(.96)}
.dpad .pad-key{border-radius:14px;font-size:clamp(20px,6vw,31px)}
.dpad-center{border:0;background:rgba(17,28,45,.45);pointer-events:none}
.action-pad{display:grid;align-items:center;justify-items:center;gap:8px;width:min(42vw,220px)}
.action-pad.arcade{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}
.action-pad.console{grid-template-columns:repeat(2,1fr);grid-template-rows:auto auto}
.action-pad .pad-key{width:clamp(64px,17vw,86px);height:clamp(64px,17vw,86px);border-radius:50%;font-size:18px}
.action-pad .action-1{grid-column:1;grid-row:2}
.action-pad .action-2{grid-column:2;grid-row:1}
.action-pad .action-3{grid-column:2;grid-row:2}
.action-pad .shoulder{width:100%;height:46px;border-radius:15px;font-size:14px}
.system-pad{display:flex;flex-direction:column;align-items:center;gap:7px;padding-bottom:3px}
.system-pad .pad-key{width:76px;height:42px;border-radius:999px;font-size:12px;letter-spacing:.02em}
.system-pad .test-key{border-color:rgba(255,190,106,.68);background:rgba(99,58,18,.8)}
.control-hint{display:block;font-size:9px;font-weight:600;opacity:.7}

@media(max-width:600px) and (orientation:portrait){
  body.running{padding:0}
  body.running main{width:100%}
  body.running header{padding:max(8px,env(safe-area-inset-top)) 10px 0;margin:0;position:relative;z-index:3;background:#070b12}
  body.running header p{display:none}
  body.running h1{font-size:15px}
  body.running #status{font-size:10px}
  #catalog{grid-template-columns:1fr 1fr}.game-card{min-height:145px;padding:11px}.game-title{font-size:14px}
  body.touch-ui #game-shell{display:grid;grid-template-rows:minmax(300px,56dvh) auto;margin:6px 0 0;padding:0;border:0;border-radius:0;overflow:visible}
  body.touch-ui #game{height:56dvh;min-height:300px}
  body.touch-ui #touch-controls{position:relative;padding:12px max(10px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:#0b1320;border-top:1px solid #2f405b}
  body.touch-ui .touch-layout{min-height:260px}
  .notice{font-size:11px;margin:0;border-radius:0}
}
@media(max-width:420px){#catalog{grid-template-columns:1fr}}
@media(orientation:landscape) and (max-height:700px){
  body{padding:4px}
  main{width:100%}
  header{position:absolute;z-index:40;left:12px;right:12px;pointer-events:none;text-shadow:0 1px 3px #000}
  header p{display:none}h1{font-size:15px}#status{font-size:10px}
  #game-shell{margin:0;padding:0;border:0;border-radius:0;height:calc(100dvh - 8px)}
  #game{height:100%;min-height:0}
  .notice{display:none}
  body.touch-ui #touch-controls{position:absolute;z-index:30;inset:0;pointer-events:none}
  body.touch-ui .touch-layout{position:absolute;inset:0;grid-template-columns:minmax(155px,29vw) 1fr minmax(175px,31vw);align-items:end;padding:max(50px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(9px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
  body.touch-ui #touch-controls .pad-key{pointer-events:auto}
  .dpad{width:min(29vw,43vh,190px)}
  .action-pad{width:min(31vw,46vh,210px);justify-self:end}
  .action-pad .pad-key{width:clamp(58px,15vh,82px);height:clamp(58px,15vh,82px)}
  .system-pad{align-self:end;padding-bottom:2px}
  .system-pad .pad-key{width:70px;height:36px;min-height:36px}
}
@media(pointer:fine){#touch-controls{display:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Open ROM · Web Emulator</h1>
      <p>오픈 라이선스 및 사용자 제공 ROM · 브라우저 직접 실행</p>
    </div>
    <div id="status" role="status">카탈로그 불러오는 중…</div>
  </header>

  <section id="preflight">
    <p class="intro">
      저장소에는 오픈 라이선스 ROM과 사용자가 직접 제공한 ROM이 구분되어 표시됩니다.
      모바일에서는 기기 방향에 맞춰 전용 멀티터치 패드가 자동 배치됩니다.
    </p>
    <div id="catalog" role="radiogroup" aria-label="실행할 게임 선택"></div>
    <label class="agree">
      <input id="agree" type="checkbox">
      <span id="agree-text">선택한 게임의 라이선스와 이용 조건을 확인했습니다.</span>
    </label>
    <div class="actions">
      <button id="launch" type="button" disabled>선택한 게임 시작</button>
      <span id="selection"></span>
    </div>
  </section>

  <section id="game-shell" hidden aria-label="게임 에뮬레이터">
    <div id="game"></div>
    <section id="touch-controls" aria-label="모바일 게임 컨트롤러">
      <div class="touch-layout">
        <div id="dpad" class="dpad" aria-label="8방향 패드"></div>
        <div id="system-pad" class="system-pad" aria-label="시스템 버튼"></div>
        <div id="action-pad" class="action-pad" aria-label="액션 버튼"></div>
      </div>
    </section>
  </section>

  <aside class="notice">
    모바일 가로 화면에서는 패드가 게임 위에 반투명으로 표시되고, 세로 화면에서는 게임 아래에 분리됩니다. 방향과 액션 버튼은 동시에 길게 누를 수 있습니다.
  </aside>
  <pre id="error" aria-live="polite"></pre>
</main>

<script>
"use strict";
(() => {
  const ROBBY = {
    id: "robby",
    title: "Robby Roto",
    platform: "Arcade",
    core: "mame2003_plus",
    url: "https://raw.githubusercontent.com/mamedev/www.mamedev.org/e27034c7eb14717f287a789ffde35593a4c162f6/roms/robby/robby.zip",
    license: "MAMEdev 비상업 사용",
    developer: "Bally/Midway",
    release_date: "1981",
    source_page: "https://www.mamedev.org/roms/robby/",
    hosted: false,
    control_profile: "arcade"
  };

  const catalogNode = document.querySelector("#catalog");
  const agree = document.querySelector("#agree");
  const agreeText = document.querySelector("#agree-text");
  const launch = document.querySelector("#launch");
  const shell = document.querySelector("#game-shell");
  const status = document.querySelector("#status");
  const selection = document.querySelector("#selection");
  const error = document.querySelector("#error");
  const touchControls = document.querySelector("#touch-controls");
  const dpad = document.querySelector("#dpad");
  const systemPad = document.querySelector("#system-pad");
  const actionPad = document.querySelector("#action-pad");

  let games = [ROBBY];
  let selected = null;
  let loading = false;
  const inputRefs = new Map();
  const pointerStates = new Map();
  const inputEvents = [];

  window.touchControlDiagnostics = {
    visible: false,
    profile: null,
    serviceEvents: 0,
    events: inputEvents
  };

  function fail(reason) {
    console.error(reason);
    status.textContent = "실행 실패";
    error.textContent = reason?.stack || String(reason);
    launch.disabled = !agree.checked || !selected;
    loading = false;
  }

  function escapeText(value) {
    return String(value ?? "").replace(/[&<>\"']/g, character => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
    })[character]);
  }

  function renderCatalog() {
    catalogNode.innerHTML = games.map(game => {
      const source = game.source_page
        ? `<a class="game-source" href="${escapeText(game.source_page)}" target="_blank" rel="noopener">출처·라이선스 확인</a>`
        : "";
      const hosted = game.hosted === false ? "공식 원격 파일" : "저장소 포함";
      const licenseClass = game.user_supplied ? "game-license user" : "game-license";
      const licenseText = game.user_supplied ? "사용자 제공 ROM" : game.license;
      return `<label class="game-card">
        <input type="radio" name="game" value="${escapeText(game.id)}">
        <span class="game-title">${escapeText(game.title)}</span>
        <span class="game-meta">${escapeText(game.platform)} · ${escapeText(game.developer)}<br>${hosted}${game.release_date ? ` · ${escapeText(game.release_date)}` : ""}</span>
        <span class="${licenseClass}">${escapeText(licenseText)}</span>
        ${source}
      </label>`;
    }).join("");

    catalogNode.querySelectorAll('input[name="game"]').forEach(input => {
      input.addEventListener("change", () => selectGame(input.value));
    });

    const requested = new URLSearchParams(location.search).get("game");
    const preferred = games.find(game => game.id === requested)
      || games.find(game => game.id === "cybercoaster")
      || games[0];
    const input = catalogNode.querySelector(`input[value="${CSS.escape(preferred.id)}"]`);
    if (input) {
      input.checked = true;
      selectGame(preferred.id);
    }
  }

  function selectGame(id) {
    selected = games.find(game => game.id === id) || null;
    agree.checked = false;
    launch.disabled = true;
    error.textContent = "";
    if (!selected) return;
    agreeText.textContent = selected.user_supplied
      ? `${selected.title} ROM을 직접 제공했으며 사용할 권한이 있음을 확인합니다.`
      : `${selected.title}의 ${selected.license} 조건과 저작권 고지를 확인했습니다.`;
    selection.textContent = `${selected.title} · ${selected.platform}`;
    status.textContent = "게임 선택 완료";
  }

  agree.addEventListener("change", () => {
    launch.disabled = !agree.checked || loading || !selected;
  });

  function isTouchEnvironment() {
    const params = new URLSearchParams(location.search);
    return params.get("touch") === "1" || navigator.maxTouchPoints > 0 || matchMedia("(pointer: coarse)").matches;
  }

  function inputButton({ id, label, hint = "", inputs = [], key = "", className = "" }) {
    const button = document.createElement("button");
    button.type = "button";
    button.id = id;
    button.className = `pad-key ${className}`.trim();
    button.dataset.inputs = inputs.join(",");
    if (key) button.dataset.key = key;
    button.setAttribute("aria-label", hint ? `${label} ${hint}` : label);
    button.innerHTML = `<span>${escapeText(label)}${hint ? `<span class="control-hint">${escapeText(hint)}</span>` : ""}</span>`;
    return button;
  }

  function buildDpad() {
    const directions = [
      ["↖", [4, 6], "왼쪽 위"], ["↑", [4], "위"], ["↗", [4, 7], "오른쪽 위"],
      ["←", [6], "왼쪽"], ["", [], ""], ["→", [7], "오른쪽"],
      ["↙", [5, 6], "왼쪽 아래"], ["↓", [5], "아래"], ["↘", [5, 7], "오른쪽 아래"]
    ];
    dpad.replaceChildren(...directions.map(([label, inputs, hint], index) => {
      if (!inputs.length) {
        const center = document.createElement("span");
        center.className = "dpad-center";
        return center;
      }
      return inputButton({ id: `touch-dir-${index}`, label, hint, inputs, className: "direction-key" });
    }));
  }

  function buildTouchControls(game) {
    buildDpad();
    systemPad.replaceChildren();
    actionPad.replaceChildren();
    const arcade = game.control_profile === "arcade";
    actionPad.className = `action-pad ${arcade ? "arcade" : "console"}`;

    if (arcade) {
      actionPad.append(
        inputButton({ id: "touch-b1", label: "B1", hint: "버튼 1", inputs: [0], className: "action-1" }),
        inputButton({ id: "touch-b2", label: "B2", hint: "버튼 2", inputs: [8], className: "action-2" }),
        inputButton({ id: "touch-b3", label: "B3", hint: "버튼 3", inputs: [1], className: "action-3" })
      );
      systemPad.append(
        inputButton({ id: "touch-test", label: "TEST", hint: "초기 설정", key: "F2", className: "test-key" }),
        inputButton({ id: "touch-coin", label: "COIN", inputs: [2] }),
        inputButton({ id: "touch-start", label: "START", inputs: [3] })
      );
    } else {
      if (game.core === "mgba") {
        actionPad.append(
          inputButton({ id: "touch-l", label: "L", inputs: [10], className: "shoulder" }),
          inputButton({ id: "touch-r", label: "R", inputs: [11], className: "shoulder" })
        );
      }
      actionPad.append(
        inputButton({ id: "touch-b", label: "B", inputs: [0], className: "action-1" }),
        inputButton({ id: "touch-a", label: "A", inputs: [8], className: "action-2" })
      );
      systemPad.append(
        inputButton({ id: "touch-select", label: "SELECT", inputs: [2] }),
        inputButton({ id: "touch-start", label: "START", inputs: [3] })
      );
    }

    const visible = isTouchEnvironment();
    document.body.classList.toggle("touch-ui", visible);
    touchControls.hidden = !visible;
    window.touchControlDiagnostics.visible = visible;
    window.touchControlDiagnostics.profile = arcade ? "arcade" : "console";
  }

  function simulateInput(index, value) {
    const manager = window.EJS_emulator?.gameManager;
    if (!manager?.simulateInput) return false;
    manager.simulateInput(0, index, value);
    inputEvents.push({ index, value, at: Date.now() });
    if (inputEvents.length > 80) inputEvents.splice(0, inputEvents.length - 80);
    return true;
  }

  function holdInputs(pointerId, button, indexes) {
    releasePointer(pointerId);
    for (const index of indexes) {
      const count = inputRefs.get(index) || 0;
      inputRefs.set(index, count + 1);
      if (count === 0) simulateInput(index, 1);
    }
    pointerStates.set(pointerId, { button, indexes });
    button.classList.add("is-pressed");
  }

  function releasePointer(pointerId) {
    const state = pointerStates.get(pointerId);
    if (!state) return;
    for (const index of state.indexes) {
      const next = Math.max(0, (inputRefs.get(index) || 1) - 1);
      if (next === 0) {
        inputRefs.delete(index);
        simulateInput(index, 0);
      } else {
        inputRefs.set(index, next);
      }
    }
    state.button.classList.remove("is-pressed");
    pointerStates.delete(pointerId);
  }

  function releaseAllInputs() {
    for (const pointerId of [...pointerStates.keys()]) releasePointer(pointerId);
    for (const index of [...inputRefs.keys()]) simulateInput(index, 0);
    inputRefs.clear();
    touchControls.querySelectorAll(".is-pressed").forEach(button => button.classList.remove("is-pressed"));
  }

  function createKeyboardEvent(type, key, code, keyCode) {
    const event = new KeyboardEvent(type, { key, code, bubbles: true, cancelable: true });
    try {
      Object.defineProperties(event, {
        keyCode: { get: () => keyCode },
        which: { get: () => keyCode }
      });
    } catch {}
    return event;
  }

  function sendServiceSwitch() {
    const emulator = window.EJS_emulator;
    const manager = emulator?.gameManager;
    try { manager?.functions?.setKeyboardEnabled?.(1); } catch {}
    const target = emulator?.canvas || document.querySelector("#game canvas") || document;
    try { target.focus?.({ preventScroll: true }); } catch { target.focus?.(); }
    target.dispatchEvent(createKeyboardEvent("keydown", "F2", "F2", 113));
    window.touchControlDiagnostics.serviceEvents += 1;
    setTimeout(() => target.dispatchEvent(createKeyboardEvent("keyup", "F2", "F2", 113)), 140);
  }

  touchControls.addEventListener("pointerdown", event => {
    const button = event.target.closest(".pad-key");
    if (!button || !touchControls.contains(button)) return;
    event.preventDefault();
    try { button.setPointerCapture(event.pointerId); } catch {}
    if (button.dataset.key === "F2") {
      button.classList.add("is-pressed");
      pointerStates.set(event.pointerId, { button, indexes: [] });
      sendServiceSwitch();
      return;
    }
    const indexes = button.dataset.inputs.split(",").filter(Boolean).map(Number);
    if (indexes.length) holdInputs(event.pointerId, button, indexes);
  });

  touchControls.addEventListener("pointermove", event => {
    const state = pointerStates.get(event.pointerId);
    if (!state || !state.button.classList.contains("direction-key")) return;
    const next = document.elementFromPoint(event.clientX, event.clientY)?.closest(".direction-key");
    if (!next || next === state.button) return;
    const indexes = next.dataset.inputs.split(",").filter(Boolean).map(Number);
    holdInputs(event.pointerId, next, indexes);
  });

  for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) {
    touchControls.addEventListener(type, event => releasePointer(event.pointerId));
  }
  window.addEventListener("blur", releaseAllInputs);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) releaseAllInputs();
  });

  function disableBuiltInVirtualGamepad() {
    const emulator = window.EJS_emulator;
    if (!emulator) return;
    try { emulator.toggleVirtualGamepad?.(false); } catch {}
    try { emulator.changeSettingOption?.("virtual-gamepad", "disabled", true); } catch {}
    if (emulator.virtualGamepad) emulator.virtualGamepad.style.display = "none";
  }

  function startSelectedGame() {
    if (loading || !agree.checked || !selected) return;
    loading = true;
    launch.disabled = true;
    status.textContent = `${selected.title} 코어 로딩 중…`;
    error.textContent = "";
    shell.hidden = false;
    document.body.classList.add("running");
    buildTouchControls(selected);

    window.EJS_player = "#game";
    window.EJS_core = selected.core;
    window.EJS_gameName = selected.rom_name || (selected.id === "robby" ? "robby" : selected.title);
    window.EJS_gameUrl = selected.url;
    window.EJS_pathtodata = "https://cdn.emulatorjs.org/4.2.3/data/";
    window.EJS_startOnLoaded = true;
    window.EJS_fullscreenOnLoaded = false;
    window.EJS_controlScheme = selected.control_profile === "arcade" ? "mame" : undefined;
    window.EJS_gameID = selected.id;
    window.EJS_backgroundColor = "#000";
    window.EJS_disableAutoLang = true;
    window.EJS_language = "en-US";
    window.EJS_askBeforeExit = false;
    window.EJS_noAutoFocus = false;
    window.EJS_AdUrl = "";
    if (isTouchEnvironment()) window.EJS_browserMode = "mobile";
    window.EJS_VirtualGamepadSettings = [];

    window.EJS_Buttons = {
      playPause: true, restart: true, mute: true, settings: true, fullscreen: true,
      saveState: true, loadState: true, screenRecord: false, gamepad: true,
      cheat: false, volume: true, saveSavFiles: false, loadSavFiles: false,
      quickSave: true, quickLoad: true, screenshot: true, cacheManager: false,
      exitEmulation: false
    };

    window.EJS_ready = () => {
      disableBuiltInVirtualGamepad();
      status.textContent = "코어 준비 완료";
    };
    window.EJS_onGameStart = () => {
      loading = false;
      disableBuiltInVirtualGamepad();
      setTimeout(disableBuiltInVirtualGamepad, 250);
      setTimeout(disableBuiltInVirtualGamepad, 1000);
      status.textContent = `${selected.title} 실행 중`;
      window.webEmulatorDiagnostics = {
        ready: true,
        id: selected.id,
        core: selected.core,
        hosted: selected.hosted !== false,
        hasEmulator: Boolean(window.EJS_emulator),
        customTouchControls: window.touchControlDiagnostics.visible,
        controlProfile: window.touchControlDiagnostics.profile
      };
    };

    const loader = document.createElement("script");
    loader.src = "https://cdn.emulatorjs.org/4.2.3/data/loader.js";
    loader.async = true;
    loader.onerror = () => fail(new Error("EmulatorJS 로더를 가져오지 못했습니다."));
    document.body.appendChild(loader);
  }

  window.addEventListener("error", event => {
    const message = String(event.error?.message || event.message || "");
    if (/Wake Lock permission request denied/i.test(message)) return;
    if (loading) fail(event.error || event.message);
  });

  launch.addEventListener("click", startSelectedGame);

  (async () => {
    try {
      const response = await fetch("./roms/manifest.json", { cache: "no-store" });
      if (!response.ok) throw new Error(`ROM 카탈로그 HTTP ${response.status}`);
      const manifest = await response.json();
      const hostedGames = manifest.games.map(game => ({
        ...game,
        hosted: true,
        control_profile: game.control_profile || (game.core === "mame2003_plus" ? "arcade" : "console")
      }));
      games = [...hostedGames, ROBBY];
      status.textContent = `${hostedGames.length}개 ROM 준비 완료`;
    } catch (reason) {
      console.warn(reason);
      status.textContent = "ROM 목록 실패 · Robby Roto만 사용 가능";
      games = [ROBBY];
    }
    renderCatalog();
  })();
})();
</script>
</body>
</html>
