<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<title>Robby Roto · Native Web Arcade</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#070b12;color:#f4f7ff;overscroll-behavior:none}
body{padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
main{width:min(100%,760px);margin:auto}
header{margin:8vh 0 24px;text-align:center}
h1{margin:0;font-size:clamp(25px,7vw,42px)}
header p{margin:8px 0 0;color:#9aa8c0}
.card{padding:18px;border:1px solid #33435e;border-radius:16px;background:#0e1726;box-shadow:0 18px 60px rgba(0,0,0,.28)}
.notice{font-size:14px;line-height:1.6;color:#d4def1}
.agree{display:flex;gap:10px;align-items:flex-start;margin:18px 0;font-size:14px;line-height:1.5}
.agree input{width:20px;height:20px;margin:1px 0 0;flex:none}
button{width:100%;min-height:54px;border:1px solid #5b91e8;border-radius:12px;background:#245ea9;color:white;font-size:17px;font-weight:800;touch-action:manipulation}
button:disabled{opacity:.42}
#status{min-height:22px;margin-top:14px;text-align:center;color:#75f0a3;font:13px ui-monospace,SFMono-Regular,Consolas,monospace}
#detail{margin:10px 0 0;white-space:pre-wrap;color:#ff9c9c;font:12px ui-monospace,SFMono-Regular,Consolas,monospace}
#emulator{display:none;position:fixed;inset:0;background:#000;z-index:10;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#game{width:100%;height:100%;min-height:100dvh}
.small{margin-top:14px;text-align:center;color:#78869d;font-size:12px;line-height:1.45}
</style>
</head>
<body>
<main id="launcher">
  <header>
    <h1>Robby Roto</h1>
    <p>WebAssembly · MAME 2003 Plus</p>
  </header>
  <section class="card">
    <div class="notice">
      DOS 가상머신 없이 브라우저용 아케이드 코어로 직접 실행합니다. 모바일에서는 화면을 가로로 돌리면 가상 방향키와 버튼을 더 넓게 사용할 수 있습니다.
    </div>
    <label class="agree">
      <input id="agree" type="checkbox">
      <span>Robby Roto ROM은 권리자의 허가에 따라 비상업적 사용만 가능하며, 해당 조건과 저작권 고지를 확인했습니다.</span>
    </label>
    <button id="start" disabled>게임 시작</button>
    <div id="status" role="status">시작 대기</div>
    <pre id="detail"></pre>
  </section>
  <p class="small">공식 MAMEdev 배포 ROM을 직접 불러오며 저장소에는 상용 ROM을 포함하지 않습니다.</p>
</main>

<section id="emulator" aria-label="Robby Roto 에뮬레이터">
  <div id="game"></div>
</section>

<script>
"use strict";
const agree = document.querySelector("#agree");
const start = document.querySelector("#start");
const status = document.querySelector("#status");
const detail = document.querySelector("#detail");
let loading = false;

agree.addEventListener("change", () => {
  start.disabled = !agree.checked || loading;
});

function setStatus(text) {
  status.textContent = text;
}

function showError(error) {
  console.error(error);
  loading = false;
  start.disabled = !agree.checked;
  setStatus("실행 실패");
  detail.textContent = error?.stack || String(error);
}

start.addEventListener("click", () => {
  if (loading || !agree.checked) return;
  loading = true;
  start.disabled = true;
  setStatus("브라우저 아케이드 코어 불러오는 중…");
  detail.textContent = "";

  window.EJS_player = "#game";
  window.EJS_core = "mame2003_plus";
  window.EJS_gameName = "Robby Roto";
  window.EJS_gameUrl = "https://raw.githubusercontent.com/mamedev/www.mamedev.org/e27034c7eb14717f287a789ffde35593a4c162f6/roms/robby/robby.zip";
  window.EJS_pathtodata = "https://cdn.emulatorjs.org/4.2.3/data/";
  window.EJS_startOnLoaded = true;
  window.EJS_fullscreenOnLoaded = false;
  window.EJS_backgroundColor = "#000";
  window.EJS_color = "#2f78d4";
  window.EJS_gameID = "robby-roto-official";
  window.EJS_AdUrl = "";
  window.EJS_askBeforeExit = false;
  window.EJS_Buttons = {
    playPause: true,
    restart: true,
    mute: true,
    settings: true,
    fullscreen: true,
    saveState: false,
    loadState: false,
    screenRecord: false,
    gamepad: true,
    cheat: false,
    volume: true,
    saveSavFiles: false,
    loadSavFiles: false,
    quickSave: false,
    quickLoad: false,
    screenshot: true,
    cacheManager: false,
    exitEmulation: false
  };

  window.EJS_ready = () => {
    setStatus("코어 준비 완료");
  };
  window.EJS_onGameStart = () => {
    document.querySelector("#launcher").hidden = true;
    document.querySelector("#emulator").style.display = "block";
    setStatus("Robby Roto 실행 중");
    window.nativeArcadeDiagnostics = {
      ready: true,
      core: window.EJS_core,
      hasEmulator: Boolean(window.EJS_emulator)
    };
  };

  window.addEventListener("error", event => {
    if (loading) showError(event.error || event.message);
  }, { once: true });

  const script = document.createElement("script");
  script.src = "https://cdn.emulatorjs.org/4.2.3/data/loader.js";
  script.onerror = () => showError(new Error("EmulatorJS loader.js 다운로드 실패"));
  document.body.appendChild(script);
});
</script>
</body>
</html>
