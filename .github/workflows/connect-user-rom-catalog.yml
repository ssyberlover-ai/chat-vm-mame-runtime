name: Connect user ROM catalog metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/connect-user-rom-catalog.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Preserve MAME shortname and control profile
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("site/index.html")
          text = path.read_text(encoding="utf-8")

          old_name = 'window.EJS_gameName = selected.id === "robby" ? "robby" : selected.title;'
          new_name = 'window.EJS_gameName = selected.rom_name || (selected.id === "robby" ? "robby" : selected.title);'
          if old_name in text:
              text = text.replace(old_name, new_name)
          elif new_name not in text:
              raise RuntimeError("EJS_gameName assignment was not found")

          old_map = 'const hostedGames = manifest.games.map(game => ({ ...game, hosted: true, control_profile: "console" }));'
          new_map = '''const hostedGames = manifest.games.map(game => ({
            ...game,
            hosted: true,
            control_profile: game.control_profile || (game.core === "mame2003_plus" ? "arcade" : "console")
          }));'''
          if old_map in text:
              text = text.replace(old_map, new_map)
          elif 'control_profile: game.control_profile ||' not in text:
              raise RuntimeError("Hosted game mapping was not found")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit runtime connection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: use catalog ROM shortname and control profile"
          git push
