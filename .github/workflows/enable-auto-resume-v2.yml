name: Apply browser autosave and resume v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/enable-auto-resume-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Patch emulator page
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("site/index.html")
          text = path.read_text(encoding="utf-8")

          if "function autoStateKey(game)" not in text:
              old = '''  let games = [ROBBY];
          let selected = null;
          let loading = false;

          function fail(reason) {'''
              new = '''  let games = [ROBBY];
          let selected = null;
          let loading = false;
          let autoSaveTimer = null;
          let autoSaveBusy = false;

          function autoStateKey(game) {
            return `chat-vm:auto:${game.id}.state`;
          }

          async function persistAutoState(reason = "interval") {
            const emulator = window.EJS_emulator;
            if (!selected || !emulator?.gameManager || !emulator?.storage?.states || autoSaveBusy) return false;
            try {
              autoSaveBusy = true;
              const state = emulator.gameManager.getState();
              if (!state || !state.byteLength) return false;
              await emulator.storage.states.put(autoStateKey(selected), state);
              try {
                localStorage.setItem("chat-vm:last-game", selected.id);
                localStorage.setItem(`chat-vm:last-save:${selected.id}`, new Date().toISOString());
              } catch (_) {}
              console.log(`[autosave] ${selected.id} · ${reason} · ${state.byteLength} bytes`);
              return true;
            } catch (reasonValue) {
              console.warn("[autosave] failed", reasonValue);
              return false;
            } finally {
              autoSaveBusy = false;
            }
          }

          async function restoreAutoState() {
            const emulator = window.EJS_emulator;
            if (!selected || !emulator?.gameManager || !emulator?.storage?.states) return false;
            try {
              const state = await emulator.storage.states.get(autoStateKey(selected));
              if (!state || !state.byteLength) return false;
              emulator.gameManager.loadState(state);
              console.log(`[autosave] restored ${selected.id} · ${state.byteLength} bytes`);
              return true;
            } catch (reasonValue) {
              console.warn("[autosave] restore failed", reasonValue);
              return false;
            }
          }

          function beginAutoSave() {
            if (autoSaveTimer) clearInterval(autoSaveTimer);
            autoSaveTimer = setInterval(() => persistAutoState("interval"), 30000);
          }

          function fail(reason) {'''
              if old not in text:
                  raise RuntimeError("Variable insertion point not found")
              text = text.replace(old, new)

          if 'localStorage.getItem("chat-vm:last-game")' not in text:
              old = '''    const requested = new URLSearchParams(location.search).get("game");
              const preferred = games.find(game => game.id === requested)
                || games.find(game => game.id === "cybercoaster")
                || games[0];'''
              new = '''    const requested = new URLSearchParams(location.search).get("game");
              let remembered = null;
              try { remembered = localStorage.getItem("chat-vm:last-game"); } catch (_) {}
              const preferred = games.find(game => game.id === requested)
                || games.find(game => game.id === remembered)
                || games.find(game => game.id === "cybercoaster")
                || games[0];'''
              if old not in text:
                  raise RuntimeError("Preferred-game insertion point not found")
              text = text.replace(old, new)

          text = text.replace(
              'saveState: false, loadState: false, screenRecord: false, gamepad: true,',
              'saveState: true, loadState: true, screenRecord: false, gamepad: true,'
          )
          text = text.replace(
              'quickSave: false, quickLoad: false, screenshot: true, cacheManager: false,',
              'quickSave: true, quickLoad: true, screenshot: true, cacheManager: false,'
          )

          if 'changeSettingOption?.("save-state-location", "browser", true)' not in text:
              old = '''    window.EJS_ready = () => {
                forceVirtualGamepad();
                status.textContent = "코어 준비 완료";
              };'''
              new = '''    window.EJS_ready = () => {
                forceVirtualGamepad();
                try {
                  window.EJS_emulator?.changeSettingOption?.("save-state-location", "browser", true);
                } catch (reasonValue) {
                  console.warn("browser state setting", reasonValue);
                }
                status.textContent = "코어 준비 완료";
              };'''
              if old not in text:
                  raise RuntimeError("Ready callback insertion point not found")
              text = text.replace(old, new)

          if "const restored = await restoreAutoState();" not in text:
              old = '''      window.webEmulatorDiagnostics = {
                  ready: true,
                  id: selected.id,
                  core: selected.core,
                  hosted: selected.hosted !== false,
                  hasEmulator: Boolean(window.EJS_emulator)
                };
              };'''
              new = '''      window.webEmulatorDiagnostics = {
                  ready: true,
                  id: selected.id,
                  core: selected.core,
                  hosted: selected.hosted !== false,
                  hasEmulator: Boolean(window.EJS_emulator)
                };
                setTimeout(async () => {
                  const restored = await restoreAutoState();
                  status.textContent = restored
                    ? `${selected.title} 이어서 실행 중`
                    : `${selected.title} 실행 중`;
                  beginAutoSave();
                }, 1200);
              };'''
              if old not in text:
                  raise RuntimeError("Game-start insertion point not found")
              text = text.replace(old, new)

          if "visibility-hidden" not in text:
              old = '''  launch.addEventListener("click", startSelectedGame);

            (async () => {'''
              new = '''  launch.addEventListener("click", startSelectedGame);

            document.addEventListener("visibilitychange", () => {
              if (document.visibilityState === "hidden") persistAutoState("visibility-hidden");
            });
            window.addEventListener("pagehide", () => {
              persistAutoState("pagehide");
            });

            (async () => {'''
              if old not in text:
                  raise RuntimeError("Lifecycle insertion point not found")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("site/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline script found")
          Path("/tmp/site-script.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/site-script.js

      - name: Commit autosave support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: autosave and resume games in browser"
          git push
