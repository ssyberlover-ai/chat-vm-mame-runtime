name: Diagnose Hoops 96 inputs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-hoops96-inputs.yml"
      - "scripts/diagnose_hoops96_inputs.mjs"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 8000 --directory site > /tmp/input-diagnostic-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/ >/dev/null && break
            sleep 1
          done

      - name: Diagnose input paths
        id: diagnose
        continue-on-error: true
        env:
          SMOKE_URL: http://127.0.0.1:8000/?game=hoops96-user&touch=1
        run: node scripts/diagnose_hoops96_inputs.mjs

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoops96-input-diagnostics-${{ github.run_id }}
          path: |
            io-check-result.json
            io-check-*.png
            /tmp/input-diagnostic-server.log
          if-no-files-found: ignore

      - name: Record diagnostic result
        if: always()
        env:
          OUTCOME: ${{ steps.diagnose.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          details = {}
          path = Path("io-check-result.json")
          if path.exists():
              details = json.loads(path.read_text(encoding="utf-8"))
          Path("hoops96-input-diagnostics-status.json").write_text(
              json.dumps({
                  "result": os.environ["OUTCOME"],
                  "run_id": int(os.environ["RUN_ID"]),
                  "run_url": os.environ["RUN_URL"],
                  "details": details,
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          git add hoops96-input-diagnostics-status.json
          git commit -m "chore: record Hoops 96 input diagnostics" || true
          git push

      - name: Fail when diagnostic failed
        if: steps.diagnose.outcome != 'success'
        run: exit 1
