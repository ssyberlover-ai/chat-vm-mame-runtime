name: Sync open-license ROMs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-open-roms.yml"

permissions:
  contents: write

concurrency:
  group: sync-open-roms
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download current open-license releases
        run: |
          set -euo pipefail
          mkdir -p site/roms notices/open-roms

          fetch() {
            local url="$1"
            local output="$2"
            curl --fail --location --silent --show-error \
              --retry 8 --retry-delay 3 --retry-all-errors \
              -A "chat-vm-open-rom-sync/1.1" \
              "$url" --output "$output"
            test -s "$output"
          }

          fetch_latest_github_asset() {
            local repository="$1"
            local extension="$2"
            local output="$3"
            local release_json
            local asset_url
            release_json="$(mktemp)"
            fetch "https://api.github.com/repos/${repository}/releases/latest" "$release_json"
            asset_url="$(python3 - "$release_json" "$extension" <<'PY'
          import json
          import sys
          from pathlib import Path

          release = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          extension = sys.argv[2].lower()
          candidates = [
              asset for asset in release.get("assets", [])
              if str(asset.get("name", "")).lower().endswith(extension)
          ]
          if not candidates:
              raise SystemExit(
                  f"No {extension} release asset found for {release.get('html_url', 'unknown release')}"
              )
          preferred = next(
              (asset for asset in candidates if "debug" not in asset["name"].lower()),
              candidates[0],
          )
          print(preferred["browser_download_url"])
          PY
          )"
            fetch "$asset_url" "$output"
            rm -f "$release_json"
          }

          fetch "https://hh3.gbdev.io/static/database-gb/entries/tobutobugirldeluxe/tobudx.gb" \
            "site/roms/tobu-tobu-girl-deluxe.gb"
          fetch "https://hh3.gbdev.io/static/database-gb/entries/porklike-gb/porklike.gb" \
            "site/roms/porklike-gb.gb"
          fetch "https://hh3.gbdev.io/static/database-gb/entries/5-mazes/5%20mazes.gb" \
            "site/roms/5-mazes.gb"
          fetch "https://hh3.gbdev.io/static/database-nes/entries/cybercoaster/cybercoaster.nes" \
            "site/roms/cybercoaster.nes"

          # Officially distributed, permissively licensed popular homebrew games.
          fetch_latest_github_asset "sgadrat/super-tilt-bro" ".nes" \
            "site/roms/super-tilt-bro.nes"
          fetch_latest_github_asset "Vulcalien/minicraft-gba" ".gba" \
            "site/roms/minicraft-gba.gba"
          fetch "https://sanqui.net/etc/2048.gb" \
            "site/roms/2048-gb.gb"

      - name: Validate ROM formats and generate manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path("site/roms")
          nintendo_logo = bytes.fromhex(
              "CEED6666CC0D000B03730083000C000D"
              "0008111F8889000EDCCC6EE6DDDDD999"
              "BBBB67636E0EECCCDDDC999FBBB9333E"
          )
          if len(nintendo_logo) != 48:
              raise RuntimeError(f"Nintendo logo constant must be 48 bytes, got {len(nintendo_logo)}")

          games = [
              {
                  "id": "super-tilt-bro",
                  "title": "Super Tilt Bro",
                  "platform": "NES",
                  "core": "fceumm",
                  "file": "super-tilt-bro.nes",
                  "license": "WTFPL-2.0",
                  "developer": "Sylvain Gadrat",
                  "release_date": "2026-01-31",
                  "source_page": "https://sgadrat.itch.io/super-tilt-bro",
                  "source_code": "https://github.com/sgadrat/super-tilt-bro",
              },
              {
                  "id": "minicraft-gba",
                  "title": "Minicraft GBA",
                  "platform": "Game Boy Advance",
                  "core": "mgba",
                  "file": "minicraft-gba.gba",
                  "license": "GPL-3.0-or-later",
                  "developer": "Vulcalien",
                  "release_date": "2026-02-19",
                  "source_page": "https://github.com/Vulcalien/minicraft-gba/releases/latest",
                  "source_code": "https://github.com/Vulcalien/minicraft-gba",
              },
              {
                  "id": "2048-gb",
                  "title": "2048-gb",
                  "platform": "Game Boy",
                  "core": "gambatte",
                  "file": "2048-gb.gb",
                  "license": "Zlib",
                  "developer": "Sanqui",
                  "release_date": "2014",
                  "source_page": "https://github.com/Sanqui/2048-gb",
                  "source_code": "https://github.com/Sanqui/2048-gb",
              },
              {
                  "id": "tobu-tobu-girl-deluxe",
                  "title": "Tobu Tobu Girl Deluxe",
                  "platform": "Game Boy",
                  "core": "gambatte",
                  "file": "tobu-tobu-girl-deluxe.gb",
                  "license": "MIT",
                  "developer": "Tangram Games",
                  "release_date": None,
                  "source_page": "https://hh.gbdev.io/game/tobutobugirldeluxe/",
                  "source_code": "https://github.com/SimonLarsen/tobutobugirl-dx",
              },
              {
                  "id": "porklike-gb",
                  "title": "Porklike GB",
                  "platform": "Game Boy",
                  "core": "gambatte",
                  "file": "porklike-gb.gb",
                  "license": "MIT",
                  "developer": "Ben Smith (binji)",
                  "release_date": "2021-10-01",
                  "source_page": "https://hh.gbdev.io/game/porklike-gb/",
                  "source_code": "https://github.com/binji/porklike.gb",
              },
              {
                  "id": "5-mazes",
                  "title": "5 Mazes",
                  "platform": "Game Boy",
                  "core": "gambatte",
                  "file": "5-mazes.gb",
                  "license": "MIT",
                  "developer": "godai78",
                  "release_date": "2023-02-27",
                  "source_page": "https://hh.gbdev.io/game/5-mazes/",
                  "source_code": "https://github.com/godai78/5-Mazes",
              },
              {
                  "id": "cybercoaster",
                  "title": "Cybercoaster",
                  "platform": "NES",
                  "core": "fceumm",
                  "file": "cybercoaster.nes",
                  "license": "CC-BY-4.0",
                  "developer": "Fizzer & noby",
                  "release_date": "2025-04-20",
                  "source_page": "https://hh.gbdev.io/game/cybercoaster/",
                  "source_code": None,
              },
          ]

          for game in games:
              path = root / game["file"]
              data = path.read_bytes()
              if len(data) < 16 * 1024:
                  raise RuntimeError(f"ROM is unexpectedly small: {path} ({len(data)} bytes)")

              suffix = path.suffix.lower()
              if suffix == ".nes":
                  if data[:4] != b"NES\x1a":
                      raise RuntimeError(f"Invalid iNES header: {path}")
              elif suffix == ".gb":
                  if len(data) < 0x150:
                      raise RuntimeError(f"Invalid Game Boy ROM size: {path}")
                  if data[0x104:0x134] != nintendo_logo:
                      raise RuntimeError(f"Invalid Game Boy logo/header: {path}")
              elif suffix == ".gba":
                  if len(data) < 32 * 1024 or data[0xB2] != 0x96:
                      raise RuntimeError(f"Invalid Game Boy Advance header: {path}")
              else:
                  raise RuntimeError(f"Unexpected ROM extension: {path}")

              game["size_bytes"] = len(data)
              game["sha256"] = hashlib.sha256(data).hexdigest()
              game["url"] = f"./roms/{game['file']}"

          manifest = {
              "schema_version": 2,
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "policy": "Only officially distributed ROMs with explicit redistribution licenses are mirrored here.",
              "games": games,
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Write license and provenance notices
        run: |
          cat > notices/open-roms/LICENSES.md <<'EOF'
          # Open ROM license and provenance notices

          The ROM binaries under `site/roms/` are mirrored only where the upstream project publishes the ROM and its license permits redistribution.

          ## Super Tilt Bro
          - Developer: Sylvain Gadrat
          - License: WTFPL version 2
          - Source and releases: https://github.com/sgadrat/super-tilt-bro
          - Official distribution: https://sgadrat.itch.io/super-tilt-bro

          ## Minicraft GBA
          - Developer: Vulcalien
          - License: GNU GPL version 3 or later
          - Source and releases: https://github.com/Vulcalien/minicraft-gba

          ## 2048-gb
          - Developer: Sanqui
          - License: zlib
          - Source: https://github.com/Sanqui/2048-gb
          - Official binary: https://sanqui.net/etc/2048.gb

          ## Tobu Tobu Girl Deluxe
          - Copyright (c) 2017 Tangram Games
          - License: MIT
          - Source: https://github.com/SimonLarsen/tobutobugirl-dx
          - Distribution entry: https://hh.gbdev.io/game/tobutobugirldeluxe/

          ## Porklike GB
          - Copyright (c) 2021 Ben Smith
          - License: MIT
          - Source: https://github.com/binji/porklike.gb
          - Distribution entry: https://hh.gbdev.io/game/porklike-gb/

          ## 5 Mazes
          - Copyright (c) 2023 godai78
          - License: MIT
          - Source: https://github.com/godai78/5-Mazes
          - Distribution entry: https://hh.gbdev.io/game/5-mazes/

          ## Cybercoaster
          - Developer attribution: Fizzer & noby
          - License: Creative Commons Attribution 4.0 International
          - Distribution entry: https://hh.gbdev.io/game/cybercoaster/
          - License text: https://creativecommons.org/licenses/by/4.0/legalcode
          EOF

      - name: Commit verified ROMs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/roms notices/open-roms/LICENSES.md
          if git diff --cached --quiet; then
            echo "Open ROM catalog is already current."
            exit 0
          fi
          git commit -m "feat: add popular officially distributed ROMs"
          git push
