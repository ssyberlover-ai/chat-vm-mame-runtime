name: Build and deploy emulator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/smoke_test.mjs"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/live-smoke.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Assemble playable site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp site/index.html _site/index.html
          if [ -f site/manifest.webmanifest ]; then
            cp site/manifest.webmanifest _site/manifest.webmanifest
          fi
          touch _site/.nojekyll

          test -s _site/index.html
          grep -Fq 'EJS_core = "mame2003_plus"' _site/index.html
          grep -Fq 'cdn.emulatorjs.org/4.2.3/data/loader.js' _site/index.html
          grep -Fq 'Robby Roto 시작' _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 5
    steps:
      - name: Verify deployed page
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          URL="${PAGE_URL%/}/?deploy=${GITHUB_SHA}"
          curl --fail --location --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "$URL" --output /tmp/index.html
          test -s /tmp/index.html
          grep -Fq 'EJS_core = "mame2003_plus"' /tmp/index.html
          grep -Fq 'cdn.emulatorjs.org/4.2.3/data/loader.js' /tmp/index.html
          echo "Playable page published: $URL"

  report:
    if: always()
    runs-on: ubuntu-latest
    needs: [build, deploy, smoke]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Record deployment result
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          data = {
              "build": os.environ["BUILD_RESULT"],
              "deploy": os.environ["DEPLOY_RESULT"],
              "smoke": os.environ["SMOKE_RESULT"],
              "page_url": os.environ.get("PAGE_URL", ""),
              "run_url": os.environ["RUN_URL"],
              "recorded_at": datetime.now(timezone.utc).isoformat(),
          }
          Path("deployment-status.json").write_text(
              json.dumps(data, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record emulator deployment result"
          git push
