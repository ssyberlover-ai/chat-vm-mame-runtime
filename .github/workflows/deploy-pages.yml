name: Build and deploy emulator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/smoke_test.mjs"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/live-smoke.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Assemble playable site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R site/. _site/
          touch _site/.nojekyll

          test -s _site/index.html
          test -s _site/app.js
          test -s _site/styles.css
          test -s _site/roms/manifest.json
          test -s _site/roms/tobu-tobu-girl-deluxe.gb
          test -s _site/roms/porklike-gb.gb
          test -s _site/roms/5-mazes.gb
          test -s _site/roms/cybercoaster.nes
          test -s _site/roms/minicraft-gba.gba
          test -s _site/roms/2048-gb.gb
          test -s _site/roms/hoops96.zip
          grep -Fq './app.js' _site/index.html
          grep -Fq './styles.css' _site/index.html
          grep -Fq 'cdn.emulatorjs.org/4.2.3/data/loader.js' _site/app.js
          grep -Fq './roms/manifest.json' _site/app.js
          grep -Fq 'arcade-stick' _site/styles.css

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 5
    steps:
      - name: Verify deployed page and ROM catalog
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}/"
          curl --fail --location --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "${BASE}?deploy=${GITHUB_SHA}" --output /tmp/index.html
          curl --fail --location --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "${BASE}app.js?deploy=${GITHUB_SHA}" --output /tmp/app.js
          curl --fail --location --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "${BASE}styles.css?deploy=${GITHUB_SHA}" --output /tmp/styles.css
          curl --fail --location --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "${BASE}roms/manifest.json?deploy=${GITHUB_SHA}" --output /tmp/manifest.json

          test -s /tmp/index.html
          test -s /tmp/app.js
          test -s /tmp/styles.css
          test -s /tmp/manifest.json
          grep -Fq './app.js' /tmp/index.html
          grep -Fq 'arcade-stick' /tmp/styles.css
          grep -Fq 'buildArcadeStick' /tmp/app.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/manifest.json').read_text())
          ids = {game['id'] for game in data['games']}
          required = {
              'tobu-tobu-girl-deluxe', 'porklike-gb', '5-mazes',
              'cybercoaster', 'minicraft-gba', '2048-gb', 'hoops96-user'
          }
          missing = required - ids
          if missing:
              raise SystemExit(f'Missing required ROMs: {sorted(missing)}; published={sorted(ids)}')
          print('Published ROM catalog:', ', '.join(sorted(ids)))
          PY

  report:
    if: always()
    runs-on: ubuntu-latest
    needs: [build, deploy, smoke]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Record deployment result
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          data = {
              "build": os.environ["BUILD_RESULT"],
              "deploy": os.environ["DEPLOY_RESULT"],
              "smoke": os.environ["SMOKE_RESULT"],
              "page_url": os.environ.get("PAGE_URL", ""),
              "run_url": os.environ["RUN_URL"],
              "recorded_at": datetime.now(timezone.utc).isoformat(),
          }
          Path("deployment-status.json").write_text(
              json.dumps(data, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add deployment-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record emulator deployment result"
          git push
