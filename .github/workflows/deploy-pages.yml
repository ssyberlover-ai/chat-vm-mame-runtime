name: Build and deploy emulator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build_mame_disk.py"
      - "mame/m37b14b.zip"
      - ".github/workflows/deploy-pages.yml"

env:
  V86_VERSION: "0.5.424"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Fetch official v86 browser runtime
        run: |
          set -euo pipefail
          mkdir -p _generated/v86
          V86_TARBALL=$(npm pack "v86@${V86_VERSION}" --pack-destination _generated --silent)
          tar -xzf "_generated/${V86_TARBALL}" -C _generated/v86
          test -s _generated/v86/package/build/libv86.js
          test -s _generated/v86/package/build/v86.wasm
          echo "v86 package: ${V86_TARBALL}"
          sha256sum "_generated/${V86_TARBALL}"

      - name: Fetch CWSDPMI runtime
        run: |
          set -euo pipefail
          mkdir -p _generated
          curl --fail --location --retry 4 --retry-all-errors \
            https://www.ibiblio.org/pub/micro/pc-stuff/freedos/files/repositories/1.2/util/cwsdpmi.zip \
            --output _generated/cwsdpmi.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive_path = Path("_generated/cwsdpmi.zip")
          output_path = Path("_generated/CWSDPMI.EXE")

          with ZipFile(archive_path) as archive:
              candidates = [
                  name for name in archive.namelist()
                  if Path(name.replace("\\", "/")).name.upper() == "CWSDPMI.EXE"
              ]
              if not candidates:
                  raise RuntimeError("CWSDPMI.EXE was not found in the FreeDOS package")
              output_path.write_bytes(archive.read(candidates[0]))

          if output_path.stat().st_size < 1024:
              raise RuntimeError("CWSDPMI.EXE is unexpectedly small")
          print(f"Extracted {output_path}: {output_path.stat().st_size} bytes")
          PY

      - name: Build MAME data disk
        run: |
          set -euo pipefail
          python3 scripts/build_mame_disk.py \
            --zip mame/m37b14b.zip \
            --extra-file CWSDPMI.EXE=_generated/CWSDPMI.EXE \
            --output _generated/mame-hda.img \
            --gzip-output _generated/mame-hda.img.gz \
            --size-mib 32

      - name: Assemble same-origin site
        run: |
          set -euo pipefail
          mkdir -p _site/runtime _site/bios _site/images
          cp site/index.html site/emulator-v2.js site/styles.css site/manifest.webmanifest _site/
          cp _generated/v86/package/build/libv86.js _site/runtime/
          cp _generated/v86/package/build/v86.wasm _site/runtime/
          cp _generated/mame-hda.img _generated/mame-hda.img.gz _site/images/
          curl --fail --location --retry 4 --retry-all-errors \
            https://raw.githubusercontent.com/copy/v86/2f1346b0e7d88d4cbbbcc05fe15b4e369c3de23f/bios/seabios.bin \
            --output _site/bios/seabios.bin
          curl --fail --location --retry 4 --retry-all-errors \
            https://raw.githubusercontent.com/copy/v86/2f1346b0e7d88d4cbbbcc05fe15b4e369c3de23f/bios/vgabios.bin \
            --output _site/bios/vgabios.bin
          curl --fail --location --retry 4 --retry-all-errors \
            https://raw.githubusercontent.com/copy/images/master/freedos722.img \
            --output _site/images/freedos722.img
          touch _site/.nojekyll

          test -s _site/runtime/libv86.js
          test -s _site/runtime/v86.wasm
          test -s _site/emulator-v2.js
          test -s _site/images/mame-hda.img.gz
          test -s _site/images/freedos722.img
          grep -Fq './runtime/libv86.js' _site/index.html
          grep -Fq './emulator-v2.js' _site/index.html

      - name: Validate JavaScript
        run: node --check _site/emulator-v2.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 5
    steps:
      - name: Verify deployed page and required assets
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE_URL="${PAGE_URL%/}/"

          fetch_asset() {
            local path="$1"
            local output="$2"
            curl --fail --location --silent --show-error \
              --retry 12 --retry-delay 5 --retry-all-errors \
              "${BASE_URL}${path}" --output "${output}"
            test -s "${output}"
          }

          fetch_asset "" /tmp/index.html
          fetch_asset "emulator-v2.js" /tmp/emulator-v2.js
          fetch_asset "runtime/libv86.js" /tmp/libv86.js
          fetch_asset "runtime/v86.wasm" /tmp/v86.wasm
          fetch_asset "bios/seabios.bin" /tmp/seabios.bin
          fetch_asset "bios/vgabios.bin" /tmp/vgabios.bin
          fetch_asset "images/freedos722.img" /tmp/freedos722.img
          fetch_asset "images/mame-hda.img.gz" /tmp/mame-hda.img.gz

          grep -Fq './runtime/libv86.js' /tmp/index.html
          grep -Fq './emulator-v2.js' /tmp/index.html
          test "$(wc -c < /tmp/libv86.js)" -gt 100000
          test "$(wc -c < /tmp/v86.wasm)" -gt 100000
          echo "Live smoke test passed: ${BASE_URL}"

  report:
    if: always()
    runs-on: ubuntu-latest
    needs: [build, deploy, smoke]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Record deployment result
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          data = {
              "build": os.environ["BUILD_RESULT"],
              "deploy": os.environ["DEPLOY_RESULT"],
              "smoke": os.environ["SMOKE_RESULT"],
              "page_url": os.environ.get("PAGE_URL", ""),
              "run_url": os.environ["RUN_URL"],
              "recorded_at": datetime.now(timezone.utc).isoformat(),
          }
          Path("deployment-status.json").write_text(
              json.dumps(data, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record emulator deployment result"
          git push
