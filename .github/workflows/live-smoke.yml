name: Live smoke test emulator

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and deploy emulator"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: live-smoke-test-emulator-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run GitHub Pages browser test
        id: browser_test
        continue-on-error: true
        env:
          SMOKE_URL: https://ssyberlover-ai.github.io/chat-vm-mame-runtime/?browser-test=${{ github.run_id }}
        run: node scripts/smoke_test.mjs

      - name: Upload live smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-live-smoke-evidence-${{ github.run_id }}
          path: |
            smoke-result.json
            smoke-dos-ready.png
            smoke-mame.png
            smoke-failure.png
          if-no-files-found: ignore

      - name: Record live smoke result
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.browser_test.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUBLIC_URL: https://ssyberlover-ai.github.io/chat-vm-mame-runtime/
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          details = {}
          result_path = Path("smoke-result.json")
          if result_path.exists():
              details = json.loads(result_path.read_text(encoding="utf-8"))
          output = {
              "result": os.environ["TEST_OUTCOME"],
              "run_url": os.environ["RUN_URL"],
              "public_url": os.environ["PUBLIC_URL"],
              "details": details,
          }
          Path("live-smoke-status.json").write_text(
              json.dumps(output, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

          git add live-smoke-status.json
          git commit -m "chore: record hosted emulator smoke test" || true
          git push

      - name: Fail workflow when browser test failed
        if: steps.browser_test.outcome != 'success'
        run: exit 1
