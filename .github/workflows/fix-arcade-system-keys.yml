name: Fix arcade system keys

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-arcade-system-keys.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Route COIN and START through native MAME keyboard inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("site/index.html")
          text = path.read_text(encoding="utf-8")

          patches = [
              (
                  "    resetEvents: 0,\n    events: inputEvents",
                  "    resetEvents: 0,\n    coinEvents: 0,\n    startEvents: 0,\n    events: inputEvents",
              ),
              (
                  '        inputButton({ id: "touch-coin", label: "COIN", inputs: [2] }),\n        inputButton({ id: "touch-start", label: "START", inputs: [3] })',
                  '        inputButton({ id: "touch-coin", label: "COIN", command: "coin" }),\n        inputButton({ id: "touch-start", label: "START", command: "start" })',
              ),
              (
                  "  function sendServiceSwitch() {\n",
                  '''  function sendMameKey(key, code, keyCode, duration = 220) {
    const emulator = window.EJS_emulator;
    const manager = emulator?.gameManager;
    try { manager?.functions?.setKeyboardEnabled?.(1); } catch {}
    const target = emulator?.canvas || document.querySelector("#game canvas") || document;
    try { target.focus?.({ preventScroll: true }); } catch { target.focus?.(); }
    target.dispatchEvent(createKeyboardEvent("keydown", key, code, keyCode));
    setTimeout(() => target.dispatchEvent(createKeyboardEvent("keyup", key, code, keyCode)), duration);
  }

  function sendServiceSwitch() {
''',
              ),
              (
                  '    if (button.dataset.key === "F2") {',
                  '''    if (button.dataset.command === "coin") {
      button.classList.add("is-pressed");
      pointerStates.set(event.pointerId, { button, indexes: [] });
      sendMameKey("5", "Digit5", 53);
      window.touchControlDiagnostics.coinEvents += 1;
      return;
    }
    if (button.dataset.command === "start") {
      button.classList.add("is-pressed");
      pointerStates.set(event.pointerId, { button, indexes: [] });
      sendMameKey("1", "Digit1", 49);
      window.touchControlDiagnostics.startEvents += 1;
      return;
    }
    if (button.dataset.key === "F2") {''',
              ),
          ]

          for old, new in patches:
              if old not in text:
                  raise SystemExit(f"Expected patch target not found: {old[:100]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit input correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          git commit -m "fix: send COIN and START with native MAME keys"
          git push
