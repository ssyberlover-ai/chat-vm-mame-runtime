name: Add mobile reset control

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-mobile-reset-control.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Add reset command to adaptive controller
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("site/index.html")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "    serviceEvents: 0,\n    events: inputEvents",
                  "    serviceEvents: 0,\n    resetEvents: 0,\n    events: inputEvents",
              ),
              (
                  '  function inputButton({ id, label, hint = "", inputs = [], key = "", className = "" }) {',
                  '  function inputButton({ id, label, hint = "", inputs = [], key = "", command = "", className = "" }) {',
              ),
              (
                  '    if (key) button.dataset.key = key;\n    button.setAttribute',
                  '    if (key) button.dataset.key = key;\n    if (command) button.dataset.command = command;\n    button.setAttribute',
              ),
              (
                  '        inputButton({ id: "touch-test", label: "TEST", hint: "초기 설정", key: "F2", className: "test-key" }),\n        inputButton({ id: "touch-coin", label: "COIN", inputs: [2] }),',
                  '        inputButton({ id: "touch-test", label: "TEST", hint: "초기 설정", key: "F2", className: "test-key" }),\n        inputButton({ id: "touch-reset", label: "RESET", hint: "재부팅", command: "restart" }),\n        inputButton({ id: "touch-coin", label: "COIN", inputs: [2] }),',
              ),
              (
                  '    if (button.dataset.key === "F2") {\n      button.classList.add("is-pressed");',
                  '    if (button.dataset.command === "restart") {\n      button.classList.add("is-pressed");\n      pointerStates.set(event.pointerId, { button, indexes: [] });\n      window.EJS_emulator?.gameManager?.restart?.();\n      window.touchControlDiagnostics.resetEvents += 1;\n      return;\n    }\n    if (button.dataset.key === "F2") {\n      button.classList.add("is-pressed");',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected patch target not found: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit controller update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          git commit -m "feat: add RESET to adaptive arcade controls"
          git push
